    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#60a5fa" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#background)" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <rect width="1200" height="300" fill="url(#glow)" />

  <circle cx="1040" cy="72" r="112" fill="#60a5fa" opacity="0.09" />
  <circle cx="1088" cy="44" r="48" fill="#ffffff" opacity="0.35" />
  <circle cx="116" cy="70" r="74" fill="#38bdf8" opacity="0.1" />

  <g fill="none" stroke="#3b82f6" stroke-linecap="round" opacity="0.24">
    <path d="M90 214 C214 150 306 252 430 188 S662 144 786 198 1010 238 1120 176" stroke-width="2" />
    <path d="M60 238 C190 184 318 274 448 214 S680 174 822 222 1018 250 1150 202" stroke-width="1" opacity="0.55" />
